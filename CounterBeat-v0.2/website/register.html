<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register &mdash; CounterBeat</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Navigation bar, the same on every page -->
    <header class="header">
        <a class="logo" href="index.html">Counter<span>Beat</span></a>
        <nav>
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link" href="game.html">Play</a>
            <a class="nav-link" href="login.html">Log in</a>
            <a class="nav-link active" href="register.html">Register</a>
        </nav>
    </header>

    <!-- Registration form. novalidate turns off the browser's own checking so
         that every rule is applied by my JavaScript in js/register.js -->
    <main class="narrow">
        <h1>Create an account</h1>

        <div class="card">
            <p class="message" id="message"></p>

            <form id="registerForm" novalidate>
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="ShroudLite" maxlength="16">
                <span class="hint">3&ndash;16 characters: letters, numbers and underscores.</span>
                <span class="error" id="usernameError"></span>

                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com">
                <span class="error" id="emailError"></span>

                <label for="phone">Phone number</label>
                <input type="tel" id="phone" name="phone" placeholder="+44 7700 900123">
                <span class="hint">7 to 15 digits. Spaces and hyphens are fine.</span>
                <span class="error" id="phoneError"></span>

                <label for="country">Country</label>
                <select id="country" name="country">
                    <option value="">Choose a country...</option>
                    <option value="United Kingdom">United Kingdom</option>
                    <option value="Ireland">Ireland</option>
                    <option value="United Arab Emirates">United Arab Emirates</option>
                    <option value="India">India</option>
                    <option value="United States">United States</option>
                    <option value="Other">Other</option>
                </select>
                <span class="error" id="countryError"></span>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="At least 8 characters">
                <span class="hint">8+ characters with upper and lower case, a number and a symbol.</span>
                <span class="error" id="passwordError"></span>

                <label for="confirmPassword">Confirm password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Type it again">
                <span class="error" id="confirmPasswordError"></span>

                <button class="button" type="submit">Create account</button>
            </form>
        </div>

        <p class="note">Already registered? <a href="login.html">Log in instead</a>.</p>
    </main>

    <!-- Footer -->
    <footer>
        <p>CounterBeat v0.2 &mdash; CST2120 Coursework 1</p>
    </footer>

    <script src="js/register.js"></script>
</body>

</html>
